version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "Marcel-TO"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for Rust / Backend
  - package-ecosystem: "cargo"
    directory: "/savegame-editor/src-tauri"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend:rust"
    assignees:
      - "Marcel-TO"
    groups:
      backend-rust:
        patterns:
          - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "bun"
    directory: "/savegame-editor"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend:bun"
    assignees:
      - "Marcel-TO"
    groups:
      frontend-bun:
        patterns:
          - "*"
